name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Build the immutable tag selected by either trigger. A manual run
          # must never publish the currently selected branch under another tag.
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Resolve release source commit
        id: release_source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          "sha=$commit" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' must match package.json version '$expectedTag'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Audit packaged dependencies
        run: npm audit --omit=dev

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build NSIS, portable, and ZIP packages
        run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Prepare stable release asset names
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null

          $executables = @(Get-ChildItem -Path "release" -Recurse -File -Filter "*.exe")
          $setup = $executables |
            Where-Object { $_.Name -match "(?i)(setup|installer)" } |
            Select-Object -First 1
          $portable = $executables |
            Where-Object { $_.Name -match "(?i)portable" } |
            Select-Object -First 1

          if (-not $setup) {
            throw "NSIS setup executable was not found under release/."
          }
          if (-not $portable) {
            $portable = $executables |
              Where-Object {
                $_.FullName -ne $setup.FullName -and
                $_.FullName -notmatch "(?i)(win-unpacked|unpacked)"
              } |
              Select-Object -First 1
          }
          if (-not $portable) {
            throw "Portable executable was not found under release/."
          }

          Copy-Item $setup.FullName "release-assets/Sequence-Control-Tower-Setup.exe"
          Copy-Item $portable.FullName "release-assets/Sequence-Control-Tower-Portable.exe"

          $unpackedExecutable = Get-ChildItem -Path "release" -Recurse -File -Filter "Sequence Control Tower.exe" |
            Where-Object { $_.FullName -match "(?i)win-unpacked" } |
            Select-Object -First 1
          if (-not $unpackedExecutable) {
            throw "x64 unpacked application executable was not found."
          }
          $stream = [System.IO.File]::OpenRead($unpackedExecutable.FullName)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4
            $machine = $reader.ReadUInt16()
          } finally {
            $reader.Dispose()
            $stream.Dispose()
          }
          if ($machine -ne 0x8664) {
            throw "Expected an x64 PE executable (0x8664), found 0x$($machine.ToString('x4'))."
          }

          $zipPackage = Get-ChildItem -Path "release" -Recurse -File -Filter "*.zip" |
            Select-Object -First 1
          if ($zipPackage) {
            Copy-Item $zipPackage.FullName "release-assets/Sequence-Control-Tower-Windows.zip"
          } else {
            $unpacked = Get-ChildItem -Path "release" -Recurse -Directory |
              Where-Object { $_.Name -eq "win-unpacked" } |
              Select-Object -First 1
            if (-not $unpacked) {
              throw "Neither a ZIP package nor a win-unpacked directory was found."
            }
            Compress-Archive -Path "$($unpacked.FullName)\*" -DestinationPath "release-assets/Sequence-Control-Tower-Windows.zip"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path "release-assets/Sequence-Control-Tower-Windows.zip").Path
          )
          try {
            if ($zip.Entries.Count -eq 0 -or -not ($zip.Entries | Where-Object { $_.FullName -match "(?i)Sequence Control Tower\.exe$" })) {
              throw "Windows ZIP is empty or does not contain the application executable."
            }
          } finally {
            $zip.Dispose()
          }

          $setupSignature = Get-AuthenticodeSignature "release-assets/Sequence-Control-Tower-Setup.exe"
          $portableSignature = Get-AuthenticodeSignature "release-assets/Sequence-Control-Tower-Portable.exe"
          $signed = $setupSignature.Status -eq "Valid" -and $portableSignature.Status -eq "Valid"
          if ($signed) {
            @(
              "This Windows release has a valid Authenticode signature on both executable assets."
              "Verify the signer in Properties > Digital Signatures and verify SHA256SUMS.txt before running it."
            ) | Set-Content -Encoding utf8 "release-assets/WINDOWS-SIGNING-NOTICE.txt"
          } else {
            @(
              "This Windows release is unsigned or does not have a valid Authenticode signature on every executable asset."
              "Microsoft Defender SmartScreen may show an unrecognized-app warning."
              "Install only if you trust this repository, verify SHA256SUMS.txt, and your company policy permits it."
              "Production distribution requires an organization-trusted code-signing certificate."
            ) | Set-Content -Encoding utf8 "release-assets/WINDOWS-SIGNING-NOTICE.txt"
          }

          Get-ChildItem "release-assets" -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content -Encoding utf8 "release-assets/SHA256SUMS.txt"

          @(
            "### Windows distribution status"
            "- NSIS Setup, portable EXE, and ZIP were built explicitly for x64."
            "- Authenticode valid for both executable assets: **$signed**"
            "- If unsigned, SmartScreen may block first launch; see WINDOWS-SIGNING-NOTICE.txt."
          ) | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.release_source.outputs.sha }}
          name: Sequence Control Tower ${{ env.RELEASE_TAG }}
          body_path: docs/manual/90-v0.9.1-release-notes.md
          overwrite_files: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: release-assets/*
